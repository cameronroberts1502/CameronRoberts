<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Grand Final Tracker</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#0b0b0b;color:#ECE6D8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #gate{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:24px}
  #gate h1{font-size:1rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin:0}
  form{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
  label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  input{font:inherit;color:#ECE6D8;background:#141414;border:1px solid #3a3a3a;border-radius:8px;padding:12px 14px;min-width:200px}
  input:focus-visible{outline:2px solid #ECE6D8;outline-offset:2px}
  button{font:inherit;letter-spacing:.1em;text-transform:uppercase;color:#0b0b0b;background:#ECE6D8;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
  button:focus-visible{outline:2px solid #ECE6D8;outline-offset:2px}
  #err{min-height:1.2em;color:#ff8f6b;font-size:.85rem;letter-spacing:.08em}
  #frame{display:none}
  #frame iframe{display:block}
</style>
</head>
<body>
  <main id="gate">
    <h1>Grand Final Tracker</h1>
    <form id="f">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="off" placeholder="Password" aria-describedby="err" />
      <button type="submit">Enter</button>
    </form>
    <p id="err" role="status" aria-live="polite"></p>
  </main>
  <div id="frame"></div>
  <script>
    var KEY = "17djr38";
    function reveal(){
      document.getElementById("gate").style.display = "none";
      var f = document.getElementById("frame");
      f.style.display = "block";
      f.innerHTML = '<iframe src="https://grand-final-tracker.gftrack.workers.dev" title="Adelaide Grand Final title tracker" style="width:100%;height:100dvh;border:0"></iframe>';
    }
    try { if (sessionStorage.getItem("gf") === "1") reveal(); } catch (e) {}
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      if (document.getElementById("pw").value === KEY) {
        try { sessionStorage.setItem("gf", "1"); } catch (e) {}
        reveal();
      } else {
        document.getElementById("err").textContent = "Wrong password.";
      }
    });
  </script>
</body>
</html>
